<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>hwpcore 비교</title></head>
<body>
<script type="module">
// 비교 작업 본체 (compare.cjs가 숨은 창에서 실행)
const fs = require('fs');
const path = require('path');
const { pathToFileURL } = require('url');
const cfg = JSON.parse(decodeURIComponent(location.hash.slice(1)));

// 엔진이 글자 폭을 잴 때 쓰는 함수 (편집기와 같은 방식)
{
  const c = document.createElement('canvas').getContext('2d');
  let last = '';
  globalThis.measureTextWidth = (font, text) => { if (font !== last) { c.font = font; last = font; } return c.measureText(text).width; };
}

const toPng = (canvas, file) => new Promise((res, rej) => canvas.toBlob(async (b) => {
  try { fs.writeFileSync(file, Buffer.from(await b.arrayBuffer())); res(); } catch (e) { rej(e); }
}, 'image/png'));

// 글자·선이 있는 칸(잉크) 표시: 밝기 180 미만
function inkMask(ctx, W, H) {
  const d = ctx.getImageData(0, 0, W, H).data;
  const m = new Uint8Array(W * H);
  for (let i = 0, j = 0; j < m.length; i += 4, j++) {
    const a = d[i + 3] / 255;
    const lum = (0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]) * a + 255 * (1 - a);
    m[j] = lum < 180 ? 1 : 0;
  }
  return m;
}
// 마스크를 r칸만큼 넓힌다 (작은 위치 차이는 같다고 봄) — 누적합으로 빠르게
function dilate(m, W, H, r) {
  const S = new Int32Array((W + 1) * (H + 1));
  for (let y = 0; y < H; y++) { let row = 0; for (let x = 0; x < W; x++) { row += m[y * W + x]; S[(y + 1) * (W + 1) + x + 1] = S[y * (W + 1) + x + 1] + row; } }
  const o = new Uint8Array(W * H);
  for (let y = 0; y < H; y++) {
    const y0 = Math.max(0, y - r), y1 = Math.min(H, y + r + 1);
    for (let x = 0; x < W; x++) {
      const x0 = Math.max(0, x - r), x1 = Math.min(W, x + r + 1);
      o[y * W + x] = (S[y1 * (W + 1) + x1] - S[y0 * (W + 1) + x1] - S[y1 * (W + 1) + x0] + S[y0 * (W + 1) + x0]) > 0 ? 1 : 0;
    }
  }
  return o;
}
function compare(ours, ref, W, H, diffCtx) {
  const a = inkMask(ours, W, H), b = inkMask(ref, W, H);
  const da = dilate(a, W, H, 2), db = dilate(b, W, H, 2);
  let inkA = 0, inkB = 0, onlyA = 0, onlyB = 0;
  const img = diffCtx.createImageData(W, H); const p = img.data;
  for (let j = 0, i = 0; j < a.length; j++, i += 4) {
    inkA += a[j]; inkB += b[j];
    let r = 255, g = 255, bl = 255;
    if (a[j] && !db[j]) { onlyA++; r = 40; g = 90; bl = 230; }        // 우리에게만: 파랑
    else if (b[j] && !da[j]) { onlyB++; r = 230; g = 40; bl = 40; }   // 정답에만: 빨강
    else if (a[j] || b[j]) { r = g = bl = 170; }                       // 같음: 회색
    p[i] = r; p[i + 1] = g; p[i + 2] = bl; p[i + 3] = 255;
  }
  diffCtx.putImageData(img, 0, 0);
  const total = inkA + inkB;
  return { score: total ? Math.round((1 - (onlyA + onlyB) / total) * 1000) / 10 : 100, inkOurs: inkA, inkRef: inkB, onlyOurs: onlyA, onlyRef: onlyB };
}

window.__run = async () => {
  const mod = await import(pathToFileURL(cfg.glue).href);
  await mod.default({ module_or_path: await WebAssembly.compile(fs.readFileSync(cfg.wasm)) });
  const pdfjs = await import(pathToFileURL(path.join(cfg.pdfjs, 'pdf.mjs')).href);
  pdfjs.GlobalWorkerOptions.workerSrc = pathToFileURL(path.join(cfg.pdfjs, 'pdf.worker.mjs')).href;

  const docs = fs.readdirSync(cfg.docs).filter((f) => /\.(hwp|hwpx)$/i.test(f) && (!cfg.only || f.includes(cfg.only))).sort();
  const results = [];
  for (const f of docs) {
    const base = f.replace(/\.(hwp|hwpx)$/i, '');
    const refFile = path.join(cfg.ref, base + '.pdf');
    const r = { doc: f, pages: [], error: null };
    results.push(r);
    try {
      if (!fs.existsSync(refFile)) { r.error = '정답 PDF 없음'; console.log(`${f}: 정답 PDF 없음`); continue; }
      const t0 = performance.now();
      const doc = new mod.HwpDocument(new Uint8Array(fs.readFileSync(path.join(cfg.docs, f))));
      const pdf = await pdfjs.getDocument({ data: new Uint8Array(fs.readFileSync(refFile)), disableFontFace: false }).promise;
      r.oursPages = doc.pageCount(); r.refPages = pdf.numPages;
      const dir = path.join(cfg.out, base); fs.mkdirSync(dir, { recursive: true });
      const n = Math.min(r.oursPages, r.refPages);
      for (let i = 0; i < n; i++) {
        const info = JSON.parse(doc.getPageInfo(i));
        const oc = document.createElement('canvas');
        // 한글 PDF(인쇄)와 비교하므로 인쇄 프로필로 그린다 — 빈 누름틀 안내문 등 편집 화면 전용 표시는 빠진다
        doc.renderPageToCanvasFilteredWithProfile(i, oc, cfg.width / info.width, 'all', 'print');
        // 처음 쓰는 글꼴은 그리는 순간 불러오기 시작한다 — 다 불러온 뒤 다시 그려야 결과가 매번 같다
        // 그림(특히 WMF→SVG로 바꾼 것)도 처음엔 비동기로 풀리므로 잠깐 기다린 뒤 다시 그린다(편집기 화면도 풀리면 다시 그림)
        await document.fonts.ready;
        await new Promise((r) => setTimeout(r, 120));
        doc.renderPageToCanvasFilteredWithProfile(i, oc, cfg.width / info.width, 'all', 'print');
        const W = oc.width, H = oc.height;
        const page = await pdf.getPage(i + 1);
        const v1 = page.getViewport({ scale: 1 });
        // 우리 그림도 흰 바탕 위에
        const oc2 = document.createElement('canvas'); oc2.width = W; oc2.height = H;
        const octx = oc2.getContext('2d', { willReadFrequently: true });
        octx.fillStyle = '#fff'; octx.fillRect(0, 0, W, H); octx.drawImage(oc, 0, 0);
        // 정답 PDF는 두 가지로 놓아 보고 잘 맞는 쪽을 쓴다:
        //  real = 실제 크기(엔진 px=96dpi, PDF pt=72dpi)로 왼쪽 위에 — 한글이 작은 종이를 A4에 원래 크기로 찍은 경우
        //  fit  = 폭에 맞춤 — 종이 크기가 같은 경우
        const realScale = (W / info.width) * (96 / 72);
        const modes = Math.abs(realScale - W / v1.width) < 0.002 ? [['fit', W / v1.width]] : [['real', realScale], ['fit', W / v1.width]];
        let best = null;
        for (const [mode, sc] of modes) {
          const rc = document.createElement('canvas'); rc.width = W; rc.height = H;
          const rctx = rc.getContext('2d', { willReadFrequently: true });
          rctx.fillStyle = '#fff'; rctx.fillRect(0, 0, W, H);
          await page.render({ canvasContext: rctx, viewport: page.getViewport({ scale: sc }) }).promise;
          const dc = document.createElement('canvas'); dc.width = W; dc.height = H;
          const s = compare(octx, rctx, W, H, dc.getContext('2d'));
          if (!best || s.score > best.s.score) best = { s: { ...s, mode }, rc, dc };
        }
        // 쪽 전체 정렬 맞춤: 한글이 PDF를 만들 때 종이에 맞춰 줄이거나 옮긴 경우(인쇄 맞춤·메모 칸).
        // 정답 그림을 "쪽 전체에 같은 비율 k + 평행 이동"으로만 맞춘다 — 쪽 일부만 움직이지 않으므로
        // 표가 밀리거나 줄이 어긋나는 실제 배치 차이는 점수에 그대로 남는다.
        if (best.s.score < 97) {
          const ours = inkMask(octx, W, H);
          const prof = (m) => { const r = new Float64Array(H), c = new Float64Array(W);
            for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) if (m[y * W + x]) { r[y]++; c[x]++; } return [r, c]; };
          const [orow, ocol] = prof(ours);
          const shift = (a, b, R) => { let bd = 0, bv = -1; // a와 b(b를 d만큼 민 것)의 겹침이 가장 큰 d
            for (let d = -R; d <= R; d++) { let v = 0; for (let i = Math.max(0, d); i < Math.min(a.length, a.length + d); i++) v += Math.min(a[i], b[i - d]); if (v > bv) { bv = v; bd = d; } }
            return bd; };
          const ks = [];
          for (let k = 0.94; k <= 1.06 + 1e-9; k += 0.005) ks.push(k);
          if (best.s.score < 85) for (let k = 0.74; k < 0.94; k += 0.01) ks.push(k), ks.push(1 / k);
          const src = best.rc;
          for (const k of ks) {
            const t = document.createElement('canvas'); t.width = W; t.height = H;
            const tctx = t.getContext('2d', { willReadFrequently: true });
            tctx.fillStyle = '#fff'; tctx.fillRect(0, 0, W, H); tctx.drawImage(src, 0, 0, W * k, H * k);
            const [rrow, rcol] = prof(inkMask(tctx, W, H));
            const dy = shift(orow, rrow, 90), dx = shift(ocol, rcol, 90);
            const rc = document.createElement('canvas'); rc.width = W; rc.height = H;
            const rctx = rc.getContext('2d', { willReadFrequently: true });
            rctx.fillStyle = '#fff'; rctx.fillRect(0, 0, W, H); rctx.drawImage(src, dx, dy, W * k, H * k);
            const dc = document.createElement('canvas'); dc.width = W; dc.height = H;
            const s = compare(octx, rctx, W, H, dc.getContext('2d'));
            if (s.score > best.s.score) best = { s: { ...s, mode: 'align', k: Math.round(k * 1000) / 1000, dx, dy }, rc, dc };
          }
        }
        const { s, rc, dc } = best;
        await toPng(oc2, path.join(dir, `p${i + 1}-ours.png`));
        await toPng(rc, path.join(dir, `p${i + 1}-ref.png`));
        await toPng(dc, path.join(dir, `p${i + 1}-diff.png`));
        r.pages.push({ page: i + 1, ...s });
      }
      r.score = r.pages.length ? Math.round(r.pages.reduce((a, p) => a + p.score, 0) / r.pages.length * 10) / 10 : 0;
      if (r.oursPages !== r.refPages) r.score = Math.round(r.score * Math.min(r.oursPages, r.refPages) / Math.max(r.oursPages, r.refPages) * 10) / 10;
      r.ms = Math.round(performance.now() - t0);
      console.log(`${f}: ${r.score}% (쪽 ${r.oursPages}/${r.refPages}, ${r.ms}ms)`);
      doc.free?.(); pdf.destroy();
    } catch (e) { r.error = String(e && e.message || e); console.log(`${f}: 오류 ${r.error}`); }
  }
  const ok = results.filter((r) => !r.error);
  const avg = ok.length ? Math.round(ok.reduce((a, r) => a + r.score, 0) / ok.length * 10) / 10 : 0;
  fs.writeFileSync(path.join(cfg.out, 'results.json'), JSON.stringify({ when: new Date().toISOString(), wasm: cfg.wasm, average: avg, results }, null, 1));
  fs.writeFileSync(path.join(cfg.out, 'report.html'), report(results, avg));
  console.log(`평균 일치율: ${avg}% (문서 ${ok.length}개, 오류 ${results.length - ok.length}개)`);
  return 0;
};

const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function report(results, avg) {
  const rows = [...results].sort((a, b) => (a.error ? 1 : 0) - (b.error ? 1 : 0) || (a.score ?? 0) - (b.score ?? 0)).map((r) => {
    const base = r.doc.replace(/\.(hwp|hwpx)$/i, '');
    const pages = r.pages.map((p) => `<figure><figcaption>${p.page}쪽 · ${p.score}%</figcaption>
      <a href="${esc(base)}/p${p.page}-diff.png"><img loading="lazy" src="${esc(base)}/p${p.page}-diff.png"></a>
      <span><a href="${esc(base)}/p${p.page}-ours.png">우리</a> · <a href="${esc(base)}/p${p.page}-ref.png">한글</a></span></figure>`).join('');
    return `<section><h2>${esc(r.doc)} <b>${r.error ? esc(r.error) : r.score + '%'}</b> <small>${r.error ? '' : `쪽 수 우리 ${r.oursPages} / 한글 ${r.refPages}`}</small></h2><div class="pages">${pages}</div></section>`;
  }).join('');
  return `<!doctype html><html lang="ko"><head><meta charset="utf-8"><title>hwpcore 비교 결과</title><style>
:root{--bg:#f4f6f9;--ink:#1d2430;--card:#fff;--line:#dde2e8}
@media (prefers-color-scheme:dark){:root{--bg:#141922;--ink:#e6e9ef;--card:#1d2431;--line:#2c3442}}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.6 "Malgun Gothic",sans-serif;padding:16px}
h1{font-size:22px}h2{font-size:16px;margin:0 0 8px}h2 b{color:#2f6fd6;margin-left:8px}small{color:#889;font-weight:400}
section{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin:0 0 14px}
.pages{display:flex;flex-wrap:wrap;gap:10px}figure{margin:0;width:220px}figure img{width:100%;border:1px solid var(--line);background:#fff}
figcaption{font-weight:700}.legend span{display:inline-block;width:12px;height:12px;margin:0 4px 0 12px;vertical-align:-1px}
</style></head><body><h1>hwpcore ↔ 한글 2024 비교 — 평균 ${avg}%</h1>
<p class="legend">차이 그림: <span style="background:#aaa"></span>같음 <span style="background:#e62828"></span>한글에만 있음 <span style="background:#285ae6"></span>우리에게만 있음 · 낮은 점수부터 정렬</p>
${rows}</body></html>`;
}
</script>
</body></html>
